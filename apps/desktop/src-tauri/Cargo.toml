[package]
name = "weiguang-writer"
version = "0.2.0"
description = "微光写作台 / Weiguang Writer"
authors = ["Weiguang"]
edition = "2021"

[lib]
name = "weiguang_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Networking_WinHttp"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
tauri-plugin-sql = { path = "vendor/tauri-plugin-sql" }

[dev-dependencies]
